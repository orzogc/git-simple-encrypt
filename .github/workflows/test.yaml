name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # Authenticated GitHub API access for cargo-binstall (unauthenticated
      # requests are rate-limited to 60/hr/IP and were failing with 403).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # sccache must be installed before anything that may compile (binstall
      # falls back to a source build when the API is unreachable), because
      # RUSTC_WRAPPER points at the sccache binary.
      - name: Setup sccache-cache
        uses: Mozilla-Actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # main
      - run: cargo binstall -y --no-symlinks cargo-nextest
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo nextest run --all-features

  lint:
    name: clippy + fmt + docs + features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      # The crate enables pedantic/nursery/cargo lints at warn level;
      # keep the tree warning-free by denying them here.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --check
      # Feature-matrix coverage. Clippy must run on the non-default
      # combinations too: lints such as `missing_const_for_fn` and
      # `needless_lifetimes` fire only on the cfg'd-out branches, so an
      # all-features-only run cannot see them regress.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features bin -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features progress -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features colored -- -D warnings
      - run: cargo test --no-default-features --lib
      - name: rustdoc (no broken public docs)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"
      # lib + bin only: dev-dependencies may require a newer toolchain.
      - run: cargo check --all-features

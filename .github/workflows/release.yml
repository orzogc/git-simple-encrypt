name: rust release action
on:
  push:
    tags:
      - "v*"
# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read
jobs:
  # A tag push must not be able to publish a build whose tests never passed.
  # Running the gate inside this workflow (rather than trusting a separate
  # one to have finished) is what makes `needs` an actual barrier — and it
  # must be the FULL matrix: Windows/macOS tests, the clippy feature matrix,
  # rustdoc and MSRV, so no platform's binary ships ahead of its own tests.
  verify:
    name: full test matrix gate
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  release:
    needs: [verify]
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: release rust project
        uses: lxl66566/rust-simple-release@v0.2.8
        with:
          targets: |
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-musl
            x86_64-unknown-linux-gnu
            aarch64-apple-darwin
            x86_64-apple-darwin

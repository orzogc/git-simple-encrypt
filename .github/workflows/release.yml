name: rust release action
on:
  push:
    tags:
      - "v*"
# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read
jobs:
  # A tag push must not be able to publish a build whose tests never passed.
  # Running the gate inside this workflow (rather than trusting a separate
  # one to have finished) is what makes `needs` an actual barrier.
  verify:
    name: test + lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo fmt --check

  release:
    needs: [verify]
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: release rust project
        uses: lxl66566/rust-simple-release@1406bbc7c23ee53dce4c67b3d0b370ed178491de # main
        with:
          targets: |
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-musl
            x86_64-unknown-linux-gnu
            aarch64-apple-darwin
            x86_64-apple-darwin
